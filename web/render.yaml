services:
  - type: web
    name: metrolist-web
    env: node
    plan: free
    rootDir: web
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: SPOTIFY_CLIENT_ID
        value: ""
        description: "Spotify Developer Client ID"
      - key: SPOTIFY_CLIENT_SECRET
        value: ""
        description: "Spotify Developer Client Secret"
      - key: DRIVE_WEBHOOK_URL
        value: ""
        description: "Google Apps Script webhook for sync"
      - key: FRONTEND_URL
        value: "*"
        description: "CORS origin for API requests"