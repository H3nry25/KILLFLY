<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metrolist Web</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Metrolist">
  <meta name="theme-color" content="#121316">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/H3nry25/APPSPO/main/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #0b0d0e;
      --surface: #16181b;
      --card: #1e2126;
      --primary: #bb86fc;
      --accent: #4caf50;
    }
    body {
      background-color: var(--bg);
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 16px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 24px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Top Header -->
  <header class="safe-top px-4 py-3 bg-[#121316]/90 backdrop-blur-md border-b border-white/5 flex items-center justify-between z-10">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/30">
        M
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight">Metrolist</h1>
        <p class="text-[10px] text-gray-400">Web Player & Sync</p>
      </div>
    </div>

    <!-- Quick Status / Sync -->
    <div class="flex items-center space-x-2">
      <button id="syncBtn" class="text-xs bg-[#1e2126] hover:bg-[#282c34] active:scale-95 px-3 py-1.5 rounded-full border border-white/10 flex items-center space-x-1 transition">
        <span>🔄</span>
        <span class="text-gray-300 text-[11px] font-medium">Sincronizar</span>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex border-b border-white/5 bg-[#121316] px-4 pt-2">
    <button id="tabLiked" class="tab-btn active pb-2 px-3 text-sm font-semibold border-b-2 border-purple-400 text-purple-400 transition flex items-center space-x-1.5">
      <span>❤️</span>
      <span>Favoritas (<span id="likedCount">0</span>)</span>
    </button>
    <button id="tabSearch" class="tab-btn pb-2 px-3 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-white transition flex items-center space-x-1.5">
      <span>🔍</span>
      <span>Buscar</span>
    </button>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto hide-scrollbar p-4 relative" id="mainContainer">
    <!-- View: Liked Songs -->
    <section id="viewLiked" class="space-y-2">
      <div class="flex items-center justify-between pb-2">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Tus Canciones</h2>
        <button id="playAllLiked" class="text-xs bg-purple-600 hover:bg-purple-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-full flex items-center space-x-1 transition shadow-lg shadow-purple-600/30">
          <span>▶</span>
          <span>Reproducir Todo</span>
        </button>
      </div>
      <div id="likedList" class="space-y-1.5">
        <p class="text-sm text-gray-400 text-center py-10">Cargando tus canciones...</p>
      </div>
    </section>

    <!-- View: Search -->
    <section id="viewSearch" class="hidden space-y-3">
      <div class="relative">
        <input type="text" id="searchInput" placeholder="Buscar canción, artista o álbum..." class="w-full bg-[#1e2126] border border-white/10 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-purple-400 transition">
        <span class="absolute left-3.5 top-3 text-gray-400 text-sm">🔍</span>
      </div>
      <div id="searchResults" class="space-y-1.5">
        <p class="text-sm text-gray-400 text-center py-10">Escribe algo arriba para buscar en YouTube Music</p>
      </div>
    </section>
  </main>

  <!-- Bottom Player Bar (Native Lockscreen & MediaSession enabled) -->
  <footer class="safe-bottom bg-[#181a1f] border-t border-white/10 p-3 flex flex-col z-20 shadow-2xl">
    <!-- Progress Bar -->
    <div class="flex items-center space-x-2 text-[10px] text-gray-400 px-1 mb-2">
      <span id="currTime">0:00</span>
      <input type="range" id="seekSlider" min="0" max="100" value="0" class="flex-1 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-400">
      <span id="totalTime">0:00</span>
    </div>

    <!-- Controls & Info -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3 overflow-hidden flex-1 mr-2">
        <img id="playerThumb" src="https://via.placeholder.com/48" class="w-12 h-12 rounded-lg object-cover bg-black/40 flex-shrink-0 shadow-md">
        <div class="overflow-hidden">
          <p id="playerTitle" class="text-sm font-semibold truncate text-white">Selecciona una canción</p>
          <p id="playerArtist" class="text-xs text-gray-400 truncate">Metrolist Web</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="likeCurrentBtn" class="p-2 text-lg active:scale-90 transition">🤍</button>
        <button id="prevBtn" class="p-2 text-base text-gray-300 hover:text-white active:scale-90 transition">⏮</button>
        <button id="playPauseBtn" class="w-10 h-10 rounded-full bg-white text-black font-bold flex items-center justify-center text-lg active:scale-95 transition shadow-lg">
          ▶
        </button>
        <button id="nextBtn" class="p-2 text-base text-gray-300 hover:text-white active:scale-90 transition">⏭</button>
      </div>
    </div>
  </footer>

  <!-- Hidden native HTML5 Audio element -->
  <audio id="audioEl" preload="auto"></audio>

  <script src="/app.js"></script>
</body>
</html>
